name: offline-qualification
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests_handoff -v
      - run: python -m pytest -q --ignore=tests/test_kronos_real_parity.py --junitxml=evidence/pytest-ci.xml
      - run: python scripts/aegis_delivery_preflight.py --repo "$PWD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qualification
          path: evidence/pytest-ci.xml
